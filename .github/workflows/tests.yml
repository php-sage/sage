name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pest:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Install dependencies
        # --no-scripts: the post-install hook runs `npm ci`, which is only needed to rebuild the JS/CSS
        run: composer update --no-interaction --no-progress --no-scripts

      - name: Run tests
        run: vendor/bin/pest
