    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #c3c0c8;
            padding: 15px;
            background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACwAAAAsCAMAAAApWqozAAAAElBMVEXOzs7k5OTS0tLf39/X19fb29tvzHP/AAAAeklEQVR42u2TwQrAIAxDk+n+/5c3MOIh9pCrKGjlIW1NCcC5wLUq+uj2x6Zr456C7CR1vtS5pxhBgF17TzEKNM6yasDo6t+/5jTLnPWcqBHqHEwwewHUtZ2i/pVT1Ho5RT0Jpyhm7DTLnPWcqZHonE3wuvu6+7r7VHd/WSYJ6QEaQcoAAAAASUVORK5CYII=");
        }

        h1 {
            color: #333;
            margin-top: 0;
        }

        .status {
            padding: 10px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .content {
            min-height: 100dvh;
            overflow-y: auto;
        }

        .entry {
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-left: 3px solid #2196f3;
            border-radius: 3px;
        }

        .hr {
            height: 1px;
            margin-bottom: 8px;
            background: rgba(33, 150, 243, .3);
            border-radius: 3px;
            width: 100%;
        }

        .timestamp {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<h1><span style="color:#8791BE">☯</span> Sage Monitor</h1>
<div class="status">
    Just leave this window open to redirect all sage() dumps here! (latest first)
</div>
<div class="content" id="content">
    <div class="entry">Dump anything with <code>sage()</code> and it will show up here...</div>
</div>

<script>
    const containerDiv = document.getElementById('content');
    let hasContent = false;

    function checkForNewFiles() {
        fetch('?_sage_get_new_content')
            .then(response => response.text())
            .then(text => {
                if (text) addEntry(text)
            })
            .catch(error => {
                console.error('Fetch error:', error);
            });
    }

    function addEntry(content) {
        if (!hasContent) {
            containerDiv.innerHTML = '';
            hasContent = true;
        }

        const timestampDiv = document.createElement('div');
        timestampDiv.className = 'timestamp';
        timestampDiv.textContent = Temporal.Now.plainTimeISO().toString({smallestUnit: 'second'});

        const contentDiv = document.createElement('div');
        contentDiv.innerHTML = content;

        const entryDiv = document.createElement('div');
        entryDiv.className = 'entry';
        entryDiv.appendChild(timestampDiv);
        entryDiv.appendChild(contentDiv);

        containerDiv.insertBefore(entryDiv, containerDiv.firstChild);
    }

    // Check for new files every 2 seconds
    setInterval(checkForNewFiles, 2000);

    // Initial check
    checkForNewFiles();
</script>
</body>
